name: Track flats

on:
  schedule:
    # GitHub only knows UTC. These two daily firings cover 17:00 Bratislava time
    # in both summer (15:00 UTC) and winter (16:00 UTC). The "gate" step lets
    # through only the first one at or after 17:00, every 3 days.
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:       # "Run workflow" button: always runs

permissions:
  contents: write          # lets the job commit data/state.json and docs/index.html

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Bratislava
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Is it time to run?
        id: gate
        run: python -m tracker.gate

      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q

      - name: Crawl, evaluate, alert, render
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python -m tracker.main

      - name: Save history and page
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "flat-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json docs/index.html
          git commit -m "Update $(date +%F)" || echo "No changes"
          git push

      - name: Keep unparseable pages for debugging
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: data/debug
          if-no-files-found: ignore

      - name: Tell me if the run failed
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Flat tracker run failed. Open the Actions tab on GitHub to see why."
